<!doctype html>
<html lang="zh-CN">

  <body>
    <a class="skip" href="#content"

          type="search"
          id="search"
          placeholder="搜索你喜欢的游戏"
          aria-label="搜索游戏"
          data-i18n-placeholder="搜索你喜欢的游戏"
          data-i18n-aria-label="搜索游戏"

      ><button class="top-mine" data-view="favorites">
        <span data-i18n="☆ 我的收藏">☆ 我的收藏</span>

    <aside class="sidebar">

        >
        <a class="nav-button" href="/?view=favorites"

          ><span data-i18n="我的收藏">我的收藏</span></a
        >
        <a class="nav-button" href="/?view=recent"
          ><span class="symbol">◷</span
          ><span data-i18n="最近玩过">最近玩过</span></a
        >
        <a class="nav-button" href="/?view=offline"
          ><span class="symbol">↓</span
          ><span data-i18n="离线游戏">离线游戏</span></a
        >
      </nav>
      <div class="sidebar-social">
        <a
          class="sidebar-discord"
          href="https://discord.gg/X5cYjTaD"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="加入 Discord 社区 ↗"
          data-i18n-aria-label="加入 Discord 社区 ↗"
          ><span data-i18n="加入 Discord">加入 Discord</span><span aria-hidden="true">↗</span></a
        >

          class="sidebar-github"
          href="https://github.com/luka2chat/owngame"

          rel="noopener noreferrer"

        >
      </div>
    </aside>
    <main id="content" class="main" tabindex="-1">
      <div class="platform-tabs" role="group" aria-label="游玩平台" data-i18n-aria-label="游玩平台">
        <button type="button" data-platform="mobile" aria-pressed="false" data-i18n="移动端游戏">移动端游戏</button>
        <button type="button" data-platform="pc" aria-pressed="false" data-i18n="PC 游戏">PC 游戏</button>
      </div>
      <section class="welcome">
        <div>
          <div class="eyebrow">WELCOME TO YOUR OWN WORLD</div>
          <h1>
            <span data-i18n="做属于自己的游戏">做属于自己的游戏</span
            ><span class="spark">✷</span>
          </h1>
          <p>
            <span data-i18n="不充钱、不看广告、离线爽玩"
              >不充钱、不看广告、离线爽玩</span
            >
          </p>
        </div>
        <img
          class="welcome-mascot"
          src="/art/arcade-mascot.png"
          alt="戴皇冠帽的 owngame 街机小伙伴"
          width="140"
          height="150"
          fetchpriority="high"
          data-i18n-alt="戴皇冠帽的 owngame 街机小伙伴"
        />
      </section>
      <div
        id="mobile-categories"
        aria-label="游戏分类"
        data-i18n-aria-label="游戏分类"
      ></div>
      <div class="section-heading">
        <div>
          <span class="red-slash">/</span>
          <h2 id="section-title">
            <span data-i18n="挑一款，开始快乐">挑一款，开始快乐</span>
          </h2>
        </div>
        <span id="count"></span>
      </div>
      <div id="catalog-status" class="catalog-status" role="status">
        <span class="loading-mark" aria-hidden="true">✷</span>
        <span id="catalog-message"
          ><span data-i18n="正在准备游戏库…">正在准备游戏库…</span></span
        >
        <a id="catalog-retry" href="" hidden
          ><span data-i18n="重新加载 ↻">重新加载 ↻</span></a
        >
      </div>
      <div id="games" class="games" aria-busy="true" data-state="loading">
        <div class="game-card skeleton-card" aria-hidden="true">
          <div class="cover skeleton-cover"><span>✷</span></div>
          <div class="card-info">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line skeleton-short"></div>
            <div class="skeleton-action"></div>
          </div>
        </div>
        <div class="game-card skeleton-card" aria-hidden="true">
          <div class="cover skeleton-cover"><span>✷</span></div>
          <div class="card-info">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line skeleton-short"></div>
            <div class="skeleton-action"></div>
          </div>
        </div>
        <div class="game-card skeleton-card" aria-hidden="true">
          <div class="cover skeleton-cover"><span>✷</span></div>
          <div class="card-info">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line skeleton-short"></div>
            <div class="skeleton-action"></div>
          </div>
        </div>
        <div class="game-card skeleton-card" aria-hidden="true">
          <div class="cover skeleton-cover"><span>✷</span></div>
          <div class="card-info">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line skeleton-short"></div>
            <div class="skeleton-action"></div>
          </div>
        </div>
      </div>
      <noscript><p>请开启 JavaScript 来浏览和游玩游戏。</p></noscript>
      <section id="about" class="about">
        <div class="about-number">
          ∞<small><span data-i18n="种属于你的可能">种属于你的可能</span></small>
        </div>
        <div>
          <span class="eyebrow"
            ><span data-i18n="少一点打扰，多一点快乐"
              >少一点打扰，多一点快乐</span
            ></span
          >
          <h2>
            <span data-i18n="还记得打开游戏机的那一刻吗？"
              >还记得打开游戏机的那一刻吗？</span
            >
          </h2>
          <p>
            <span data-i18n="不用等广告播完，也不用为快乐充值。"
              >不用等广告播完，也不用为快乐充值。</span
            ><br /><span
              data-i18n="挑一个喜欢的世界，想玩就玩。今天，从这里开始。"
              >挑一个喜欢的世界，想玩就玩。今天，从这里开始。</span
            >
          </p>
        </div>
        <div class="about-stamp">
          YOUR GAME<br />YOUR RULES<span>★ OWNGAME ★</span>
        </div>
      </section>
      <!-- OWNGAME_SITE_FOOTER -->
    </main>
    <div id="toast" role="status" aria-live="polite" hidden></div>

    <script>
      // Runs before module downloads: slow or failed JavaScript still gets feedback.
      (() => {
        const grid = document.getElementById("games");
        const message = document.getElementById("catalog-message");
        const retry = document.getElementById("catalog-retry");
        const slow = setTimeout(() => {
          if (grid.dataset.state !== "loading") return;
          const key = "网络有点慢，游戏正在赶来…";
          message.dataset.i18n = key;
          message.textContent = window.owngameI18n?.t(key) || key;
          retry.hidden = false;
        }, 7000);
        const stalled = setTimeout(() => {
          if (grid.dataset.state !== "loading") return;
          const key = "加载时间较长，可以重新试试。";
          message.dataset.i18n = key;
          message.textContent = window.owngameI18n?.t(key) || key;
          retry.hidden = false;
        }, 25000);
        window.addEventListener(
          "owngame:catalog-settled",
          () => {
            clearTimeout(slow);
            clearTimeout(stalled);
          },
          { once: true },
        );
      })();
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
