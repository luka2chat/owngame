<!doctype html>
<html lang="zh-CN" class="player-root">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf5e8" />
    <title data-i18n="开玩 · owngame">开玩 · owngame</title>
    <link rel="icon" href="/art/arcade-mascot.png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/remix.css" />
    <link rel="stylesheet" href="/play.css?v=brand-c-2" />
    <link rel="stylesheet" href="/analytics.css" />
    <script type="module" src="/i18n.js"></script>
  </head>
  <body class="player-body">
    <div id="player-safe-area" aria-hidden="true"></div>
    <header class="topbar player-header">
      <a
        class="wordmark"
        href="/"
        aria-label="owngame 首页"
        data-i18n-aria-label="owngame 首页"
        ><span>o</span><span>w</span><span>n</span><span>g</span><span>a</span
        ><span>m</span><span>e</span></a
      >
      <form class="search" action="/" role="search">
        <span aria-hidden="true">⌕</span
        ><input
          type="search"
          name="q"
          placeholder="搜索你喜欢的游戏"
          aria-label="搜索游戏"
          data-i18n-placeholder="搜索你喜欢的游戏"
          data-i18n-aria-label="搜索游戏"
        /><kbd>/</kbd>
      </form>
      <a class="top-mine" href="/?view=favorites"
        ><span data-i18n="☆ 我的收藏">☆ 我的收藏</span></a
      >
    </header>
    <main class="detail-main">
      <nav
        class="player-breadcrumb"
        aria-label="当前位置"
        data-i18n-aria-label="当前位置"
      >
        <a href="/"><span data-i18n="← 游戏库">← 游戏库</span></a
        ><span aria-hidden="true">/</span
        ><a id="game-category" href="/"><span data-i18n="游戏">游戏</span></a
        ><span aria-hidden="true">/</span
        ><b id="breadcrumb-title"><span data-i18n="准备开玩">准备开玩</span></b>
      </nav>
      <div class="player-layout">
        <section class="player-info" aria-labelledby="game-title">
          <div class="eyebrow" id="game-subtitle">YOUR GAME, YOUR RULES</div>
          <h1>
            <span id="game-title"
              ><span data-i18n="准备开玩">准备开玩</span></span
            ><span class="spark" aria-hidden="true">✷</span>
          </h1>
          <p id="game-description"></p>
          <div class="player-actions">
            <button
              id="enter-game"
              class="player-button primary-action"
              disabled
            >
              <span data-i18n="▶ 进入游戏">▶ 进入游戏</span>
            </button>
            <button id="remix" class="player-button" disabled>
              <span data-i18n="↻ 复刻 · 做自己的版本"
                >↻ 复刻 · 做自己的版本</span
              >
            </button>
            <button id="favorite" class="player-button" disabled>
              <span data-i18n="☆ 收藏游戏">☆ 收藏游戏</span>
            </button>
            <button
              id="download"
              class="player-button download-action"
              disabled
            >
              <span data-i18n="↓ 下载离线包">↓ 下载离线包</span>
            </button>
          </div>
          <section class="instructions">
            <h2>
              <span class="red-slash" aria-hidden="true">/</span>
              <span data-i18n="怎么玩">怎么玩</span>
            </h2>
            <dl id="keyboard-help" hidden></dl>
            <p id="instructions"></p>
          </section>
        </section>
        <section
          class="player-panel"
          aria-label="游戏区域"
          data-i18n-aria-label="游戏区域"
        >
          <div id="stage">
            <div id="loading" role="status">
              <span data-i18n="游戏准备中…">游戏准备中…</span>
            </div>
          </div>
          <div class="player-tools">
            <span
              ><i aria-hidden="true"></i
              ><b id="stage-title"
                ><span data-i18n="你的游戏">你的游戏</span></b
              ></span
            >
            <div>
              <button id="fullscreen">
                <span data-i18n="⛶ 全屏">⛶ 全屏</span></button
              ><a id="new-window" target="_blank" rel="noopener"
                ><span data-i18n="↗ 新窗口">↗ 新窗口</span></a
              >
            </div>
          </div>
        </section>
      </div>
      <section
        class="player-recommend"
        aria-labelledby="recommend-title"
        hidden
      >
        <h2 id="recommend-title">
          <span class="red-slash" aria-hidden="true">/</span>
          <span data-i18n="换个世界，接着玩">换个世界，接着玩</span>
        </h2>
        <div id="recommend-games"></div>
      </section>
      <!-- OWNGAME_SITE_FOOTER -->
    </main>
    <div class="capsule">
      <button
        id="more"
        aria-label="更多游戏操作"
        data-i18n-aria-label="更多游戏操作"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="5" cy="12" r="2" />
          <circle cx="12" cy="12" r="2" />
          <circle cx="19" cy="12" r="2" />
        </svg></button
      ><span aria-hidden="true"></span
      ><a
        href="/"
        aria-label="关闭游戏，返回首页"
        data-i18n-aria-label="关闭游戏，返回首页"
        ><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle
            cx="12"
            cy="12"
            r="9"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <circle cx="12" cy="12" r="3.5" /></svg
      ></a>
    </div>
    <dialog id="menu">
      <button
        class="dialog-close"
        aria-label="关闭菜单"
        data-i18n-aria-label="关闭菜单"
      >
        ×
      </button>
      <h2 id="menu-title"><span data-i18n="你的游戏">你的游戏</span></h2>
      <button class="menu-row" id="continue">
        <span data-i18n="继续游戏">继续游戏</span></button
      ><button class="menu-row" id="menu-remix">
        <span data-i18n="复刻 · 复制给 AI">复刻 · 复制给 AI</span></button
      ><button class="menu-row" id="menu-favorite">
        <span data-i18n="收藏游戏">收藏游戏</span></button
      ><button class="menu-row" id="menu-download">
        <span data-i18n="下载离线包">下载离线包</span></button
      ><button class="menu-row" id="menu-new-window">
        <span data-i18n="新窗口打开">新窗口打开</span></button
      ><button class="menu-row" id="menu-fullscreen">
        <span data-i18n="全屏游玩">全屏游玩</span></button
      ><button class="menu-row" id="restart">
        <span data-i18n="重新打开">重新打开</span></button
      ><a class="menu-row" href="/"
        ><span data-i18n="回到 owngame 首页">回到 owngame 首页</span></a
      >
    </dialog>
    <dialog id="confirm">
      <h2><span data-i18n="重新打开游戏？">重新打开游戏？</span></h2>
      <p>
        <span data-i18n="当前这一局可能会重置，已下载的游戏会保留。"
          >当前这一局可能会重置，已下载的游戏会保留。</span
        >
      </p>
      <button id="cancel-restart" class="player-button">
        <span data-i18n="继续玩">继续玩</span></button
      ><button id="confirm-restart" class="primary">
        <span data-i18n="重新打开">重新打开</span>
      </button>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/play.js?v=brand-c-2"></script>
  </body>
</html>
