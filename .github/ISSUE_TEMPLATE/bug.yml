name: Bug report
description: Report a reproducible toolkit or template issue
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected behavior
      description: Include installed version, host, OS, template and minimal steps. Avoid secrets and full conversation logs.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual result and evidence
      description: Distinguish rule tests, real input and human experience. Say what was not tested.
    validations:
      required: true
