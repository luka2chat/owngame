name: Godot mobile checks
on:
  push:
    paths: ['examples/mobile-remakes/**', '.github/workflows/godot-mobile.yml']
  pull_request:
    paths: ['examples/mobile-remakes/**', '.github/workflows/godot-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Godot 4.4.1
        working-directory: ${{ runner.temp }}
        run: |
          curl -fL --retry 3 -o Godot_v4.4.1-stable_linux.x86_64.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          echo 'ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e  Godot_v4.4.1-stable_linux.x86_64.zip' | sha512sum --check --strict
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Nine game imports, rules, touch interactions and first-stage playthroughs
        run: python3 examples/mobile-remakes/tools/check.py
