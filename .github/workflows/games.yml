name: Game source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/games/*.test.mjs tests/web/*.test.mjs
      - run: node scripts/games/verify.mjs
      - run: node scripts/games/build-all.mjs
      - run: npm --prefix examples/tidal-reclaim run typecheck && npm --prefix examples/tidal-reclaim test
      - run: node scripts/games/rebuild-report.mjs
      - run: node --test examples/star-letters/web/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/games/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-source-verification
          path: artifacts/game-source/
