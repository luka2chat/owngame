name: Game source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/games/*.test.mjs tests/web/*.test.mjs
      - run: node scripts/games/verify.mjs
      - name: Install verified Godot 4.4.1
        working-directory: ${{ runner.temp }}
        run: |
          curl -fL --retry 3 -o Godot_v4.4.1-stable_linux.x86_64.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          echo 'ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e  Godot_v4.4.1-stable_linux.x86_64.zip' | sha512sum --check --strict
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Godot source, equipment, controls and pickups
        run: python3 examples/midnight-beacon/tools/check.py
      - run: node scripts/games/build-all.mjs
      - run: npm --prefix examples/tidal-reclaim run typecheck && npm --prefix examples/tidal-reclaim test
      - run: npm --prefix examples/azeroth-strike run typecheck && npm --prefix examples/azeroth-strike test
      - run: node scripts/games/rebuild-report.mjs
      - run: node --test examples/star-letters/web/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/games/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-source-verification
          path: artifacts/game-source/
