<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf5e8"><title>箭径出逃 · owngame</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="game">
<header><button id="levels" class="level-button" aria-label="选择关卡"><span aria-hidden="true">‹</span><strong><b id="level">01</b> / 36</strong></button><div class="hud-right"><span id="hearts" aria-label="剩余三次机会">♥ ♥ ♥</span><button id="sound" aria-label="关闭音效">♪</button></div></header>
