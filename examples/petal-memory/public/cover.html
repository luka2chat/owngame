<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花笺拾忆 · 同款素材封面</title><style>
*{box-sizing:border-box}body{margin:0;background:#39412b;overflow:hidden}.cover{position:fixed;inset:0;background:url('./assets/desk.jpg') center 39%/cover;display:flex;align-items:center;justify-content:center}.tray{width:55vmin;height:67vmin;display:grid;grid-template-columns:repeat(5,1fr);gap:1.6vmin;padding:2vmin;background:#263723a1;transform:rotate(-5deg);box-shadow:0 1.5vmin 4vmin #1225166b;border:1px solid #d8b47766}.card{position:relative;background:url('./assets/card-back.png') center/110% 110% no-repeat}.front{background-image:url('./assets/paper.png')}.specimen{position:absolute;inset:8% 12% 15%;background-image:url('./assets/specimens.png');background-size:595% 644%;background-position:8.93% 67.48%;background-repeat:no-repeat}.label{position:absolute;bottom:6%;width:100%;text-align:center;color:#31442d;font:1.5vmin serif}.cover:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 10vmin #1a291a3b;pointer-events:none}</style><div class="cover"><div class="tray" id="tray"></div></div><script>for(let i=0;i<30;i++){let card=document.createElement('div');card.className='card'+([6,13].includes(i)?' front':'');if([6,13].includes(i))card.innerHTML='<span class="specimen"></span><span class="label">蕨叶</span>';document.getElementById('tray').append(card);}</script></html>
