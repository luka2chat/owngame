<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3d3827"><title>花笺拾忆 · 纸本植物志</title><link rel="stylesheet" href="./style.css"><script defer src="./game.js"></script></head>
<body><main id="viewport" aria-label="花笺拾忆"><div id="frame">
<div id="scene" aria-hidden="true"></div>
<div id="play">
<header><div id="title-paper" class="paper"><h1>花笺拾忆</h1><div class="title-rule" aria-hidden="true">── ❧ ──</div></div>
<div id="score-paper" class="paper"><div class="score"><span id="left-score"></span><span class="dot">·</span><span id="right-score"></span></div><p id="metadata"></p></div></header>
<div id="board-input" role="group" aria-label="标本卡片"></div>
<div id="status" role="status" aria-live="polite"></div>
<nav id="main-controls" aria-label="对局操作"><button id="new" class="paper" type="button"><span class="sprig" aria-hidden="true">❧</span>新一局</button><button id="mode" class="paper" type="button"><span class="sprig" aria-hidden="true">❧</span>选玩法</button><button id="help" class="paper" type="button"><span class="sprig" aria-hidden="true">❧</span>玩法</button></nav>
<button id="simple" class="paper" type="button" aria-pressed="false"><span class="sprig" aria-hidden="true">❧</span><span id="simple-text">简动：关</span><span class="toggle" aria-hidden="true"></span></button>
</div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden><section class="dialog paper"><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-options"></div><div id="modal-actions"></div></section></div>
<div id="loading" role="status"><div class="paper loading-paper"><span class="loading-leaf" aria-hidden="true">❧</span><p id="loading-text">正在打开标本册…</p><button id="retry" class="paper" type="button" hidden>重新打开</button></div></div>
</div></main></body></html>
