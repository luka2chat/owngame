<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><meta name="theme-color" content="#e8ddc4"><title>苔庭翻面 · 纸上苔庭</title><link rel="stylesheet" href="./style.css"><script type="module" src="./game.js"></script><meta name="source-sha256" content="50caaafe0760ef425d2d0ebbdcdeade78f5f72e2ec84ffb626b565a727d7e075"></head>
<body><canvas id="garden" aria-hidden="true"></canvas><main id="viewport" aria-label="苔庭翻面">
<header id="header"><h1>苔庭翻面<span class="seal" aria-hidden="true">叶</span></h1><div id="scores" aria-label="当前棋子数量"><span id="ink-score"><img src="./assets/inkstone.png" alt=""><span id="ink-count">墨石 2</span></span><span id="move-count">第 1 手</span><span id="white-score"><span id="white-count">白瓷 2</span><img src="./assets/porcelain.png" alt=""></span></div></header>
