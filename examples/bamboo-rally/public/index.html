<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#123f39" />
    <title>竹影回珠 · 竹庭水墨</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./game.js"></script>
  </head>
  <body>
    <main id="viewport" aria-label="竹影回珠">
      <div id="frame">
        <div id="scene" aria-hidden="true"></div>
        <div id="play">
          <header>
            <h1>
              <img src="./assets/title.png" alt="竹影回珠" /><span
                class="seal"
                aria-hidden="true"
                >竹<br />庭</span
              >
            </h1>
            <div id="score" aria-label="当前比分">你 0 : 0 陪练</div>
            <div class="mode-ribbon">
              <span></span>
              <p id="mode"></p>
              <span></span>
            </div>
          </header>
          <div
            id="court"
            tabindex="0"
            role="application"
            aria-label="拖动己方半场控制球拍；方向键或WASD也可移动下方球拍"
          ></div>
          <p id="status" role="status" aria-live="polite"></p>
          <nav aria-label="对局操作">
            <button id="pause" class="paper" type="button">继续</button
            ><button id="menu" class="paper" type="button">玩法与设置</button>
          </nav>
        </div>
        <div
          id="modal"
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="dialog-title"
          hidden
        >
          <section class="dialog">
            <p class="dialog-kicker">竹 庭 · 回 珠</p>
            <h2 id="dialog-title"></h2>
            <div id="dialog-body"></div>
            <div id="dialog-actions"></div>
            <p id="dialog-error" class="error" role="status"></p>
          </section>
        </div>
        <div id="loading" role="status">
          <p>竹庭准备中…</p>
          <button id="retry" class="paper" hidden>重新打开</button>
        </div>
      </div>
    </main>
  </body>
</html>
