<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d2c"><title>月下连星</title><link rel="stylesheet" href="./style.css"><script type="module" src="./src/main.js"></script></head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <header><div class="eyebrow">MOONLIT OBSERVATORY</div><h1 id="title">月下连星</h1><p class="intro">一人执星，一人邀月。让三颗光连成一线。</p></header>
  <section class="game" aria-label="双人井字棋">
    <div class="players"><span id="star-player" class="active"><b>✦</b> 星旅人</span><i>双人同屏</i><span id="moon-player"><b>☾</b> 守月人</span></div>
    <div class="board-wrap"><div class="corner top-left"></div><div class="corner bottom-right"></div><div id="board" role="group" aria-label="三乘三棋盘"></div></div>
    <p id="status" role="status" aria-live="polite">星旅人先落子</p>
    <div class="controls"><button id="undo" type="button">↶ 悔一步</button><button id="restart" type="button">再开一局 ↗</button></div>
    <p id="storage-notice" role="alert" hidden></p>
  </section>
  <footer><span class="ornament">✧</span> 轮流轻触空格 · 横竖斜连成三颗即获胜 <span class="ornament">✧</span></footer>
</main>
</body></html>
